  question: "Дочке 3 года, днём ходит на горшок отлично, а ночью всё ещё мокрая. Это проблема?"
  answer: |
    Нет, это нормально. Ночной контроль приходит позже дневного, у многих детей — к 5–6 годам. Он зависит от созревания организма, а не от старания ребёнка, поэтому ругать или стыдить не нужно.

    Что можно делать:
    - оставить ночной подгузник или трусики, пока утром они не будут сухими несколько дней подряд;
    - предлагать сходить в туалет перед сном;
    - не ограничивать воду днём, но не давать много пить прямо перед сном;
    - спокойно реагировать на мокрые ночи.

    Обратитесь к педиатру, если ей больно мочиться, она снова стала мочиться днём после того, как была сухой, много пьёт или у неё частые запоры.
