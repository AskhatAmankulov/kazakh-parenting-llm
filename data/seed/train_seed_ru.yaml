- id: ru-s001
  lang: ru
  profile: {age_months: 2}
  sources: [sleep]
  question: "Сыну 2 месяца, он спит днём урывками по 30–40 минут и часто просыпается ночью. Это нормально?"
  answer: |
    Да, в 2 месяца это вполне нормально. В этом возрасте у ребёнка ещё не сформирован ритм дня и ночи: он только начинает складываться к 2–4 месяцам. Короткие дневные сны по 30–40 минут и ночные пробуждения для кормления — типичная картина. Ориентир по ВОЗ для детей 0–3 месяцев — 14–17 часов сна в сутки суммарно.

    Что может помочь:
    - днём больше света и общения, вечером — приглушённый свет и тишина;
    - укладывать на первых признаках усталости: трёт глаза, зевает, отворачивается;
    - простой вечерний ритуал: купание, кормление, колыбельная.

    И главное — безопасный сон: только на спине, на твёрдом матрасе без подушек и мягких игрушек, лучше в вашей комнате, но в отдельной кроватке. Если сын активен между снами, хорошо ест и прибавляет в весе, повода для беспокойства нет.

- id: ru-s002
  lang: ru
  profile: {age_months: 10}
  sources: [sleep]
  question: "Дочке 10 месяцев, засыпает только на груди. Как научить её засыпать самой?"
  answer: |
    Засыпание на груди — очень частая и естественная привычка, и в 10 месяцев её уже можно мягко менять, если вам это нужно.

    Попробуйте так:
    1. Сделайте предсказуемый ритуал на 20–30 минут: купание, пижама, кормление, книжка, колыбельная — в одном и том же порядке.
    2. Сдвиньте кормление в начало ритуала, чтобы оно не было последним шагом перед сном.
    3. Кладите дочку в кроватку сонной, но ещё не спящей. Сначала можно сидеть рядом, гладить, тихо напевать.
    4. Постепенно уменьшайте своё участие: через несколько дней просто сидите рядом, потом — у двери.

    Будьте готовы, что первые вечера будут с протестом — это нормально. Главное — последовательность: любой мягкий метод работает, если все взрослые в семье делают одинаково. Ночные пробуждения в этом возрасте ещё бывают, и это тоже вариант нормы.

- id: ru-s003
  lang: ru
  profile: {age_months: 1}
  sources: [sleep, safety]
  question: "Можно ли класть новорождённого спать на живот, бабушка говорит, что так он меньше срыгивает и не подавится?"
  answer: |
    Нет, укладывать спать нужно только на спину — и днём, и ночью. Это главная рекомендация для снижения риска синдрома внезапной детской смерти (СВДС) до года. Положение на спине не повышает риск поперхнуться срыгиванием: у здорового младенца защитные рефлексы срабатывают и в этом положении.

    Для безопасного сна:
    - твёрдый ровный матрас без подушек, бортиков, одеял-«гнёзд» и мягких игрушек;
    - кроватка в вашей комнате, особенно первые 6 месяцев;
    - не перегревайте ребёнка, без шапки во сне;
    - никакого курения рядом с ребёнком.

    Лежать на животе тоже полезно, но только во время бодрствования и под вашим присмотром — это укрепляет шею и спину. Бабушкину заботу можно понять: раньше советы были другими, но сейчас данные однозначны.

- id: ru-s004
  lang: ru
  profile: {age_months: 5}
  sources: [feeding]
  question: "Ребёнку 5 месяцев, на грудном вскармливании. Свекровь советует уже давать кашу и сок. Пора?"
  answer: |
    Пока не стоит торопиться. ВОЗ рекомендует исключительно грудное вскармливание до 6 месяцев, а прикорм вводить около 6 месяцев, продолжая кормить грудью. Сок не нужен ни сейчас, ни позже: в нём много сахара и мало пользы.

    Ориентируйтесь на признаки готовности, а не только на возраст:
    - уверенно держит голову и сидит с поддержкой;
    - интересуется едой взрослых, тянется к тарелке;
    - не выталкивает ложку языком.

    Когда начнёте, лучше выбирать продукты, богатые железом: мясное пюре, обогащённые каши, овощи. Соль и сахар не добавляйте. Если у ребёнка есть особые обстоятельства, например плохая прибавка веса, обсудите сроки прикорма с педиатром.

- id: ru-s005
  lang: ru
  profile: {age_months: 8}
  sources: [feeding]
  question: "Можно ли давать 8-месячному малышу мёд с ложечки, говорят, он полезный при простуде?"
  answer: |
    Нет, мёд нельзя давать детям до 12 месяцев — ни с ложечки, ни в каше, ни в выпечке. В мёде могут быть споры бактерий, вызывающих ботулизм, а кишечник младенца ещё не умеет с ними справляться. Это редкое, но очень опасное заболевание.

    При простуде у 8-месячного малыша помогают:
    - частое кормление грудью или смесью и питьё;
    - промывание носа солевым раствором и отсасывание слизи;
    - увлажнённый прохладный воздух в комнате.

    Обратитесь к врачу, если ребёнок плохо ест, стало меньше мокрых подгузников, тяжело дышит или температура держится больше 3 дней.

- id: ru-s006
  lang: ru
  profile: {age_months: 9}
  sources: [feeding]
  question: "Сыну 9 месяцев, ест только пюре из баночек и давится любыми кусочками. Что делать?"
  answer: |
    Это частая ситуация, и её можно исправить постепенно. К 8–10 месяцам ребёнку важно осваивать более густую еду и мягкие кусочки — это тренирует жевание и речевой аппарат.

    Как переходить:
    1. Делайте пюре чуть гуще и менее однородным, разминайте вилкой, а не блендером.
    2. Давайте мягкую еду, которую можно взять рукой: разваренные кусочки моркови или кабачка, банан, кусочки омлета, мягкая паста.
    3. Сажайте сына за общий стол — он учится, глядя на вас.
    4. Предлагайте новую текстуру много раз: иногда нужно 8–15 попыток.

    Покашливание и рвотный рефлекс при кусочках — нормальная защитная реакция, а не поперхивание. Опасно, если ребёнок не может дышать, кашлять или кричать, синеет — тогда нужна первая помощь и скорая (103 или 112). Если давится постоянно даже мягкой едой или плохо прибавляет в весе, покажите его педиатру.

- id: ru-s007
  lang: ru
  profile: {age_months: 14}
  sources: [feeding, safety]
  question: "Ребёнку год и два, можно уже давать орехи и виноград?"
  answer: |
    Целые орехи и целый виноград давать пока нельзя — до 4–5 лет это одни из самых частых причин опасного поперхивания у детей. Дыхательные пути у малыша узкие, и круглая гладкая еда может их перекрыть.

    Как давать безопасно:
    - виноград и черри-помидоры разрезайте вдоль на четвертинки;
    - орехи — только перетёртые в пасту или мелко измельчённые и добавленные в кашу, йогурт;
    - не давайте попкорн, твёрдые конфеты, сосиски кружочками;
    - ребёнок ест сидя и под присмотром, не на бегу.

    Если вы раньше не давали орехи и у ребёнка есть тяжёлая экзема или другая аллергия, первый раз обсудите это с педиатром.

- id: ru-s008
  lang: ru
  profile: {age_months: 4}
  sources: [motor]
  question: "Нашему сыну 4 месяца, на животе почти не поднимает голову и плачет. Это отставание?"
  answer: |
    Многие малыши не любят лежать на животе, и плач сам по себе не говорит об отставании. К 4 месяцам большинство детей держат голову ровно без поддержки и, лёжа на животе, опираются на предплечья.

    Как помочь:
    - выкладывайте на живот несколько раз в день понемногу, по 1–3 минуты, постепенно увеличивая время — ориентир ВОЗ около 30 минут в сутки суммарно;
    - кладите сына животом себе на грудь и разговаривайте с ним — так ему интереснее поднимать голову;
    - кладите перед ним яркую игрушку или зеркало;
    - выбирайте время, когда он сыт, но не сразу после еды.

    Если к 4 месяцам он совсем не держит голову, или вы замечаете, что тело слишком вялое или, наоборот, напряжённое, покажите его педиатру — это стоит оценить.

- id: ru-s009
  lang: ru
  profile: {age_months: 13}
  sources: [motor]
  question: "Дочке 1 год и месяц, она ещё не ходит, только ходит вдоль дивана. Ровесники уже бегают. Волноваться?"
  answer: |
    Нет, пока поводов для беспокойства нет. Нормальный возраст начала самостоятельной ходьбы по данным ВОЗ — примерно от 8 до 18 месяцев. То, что дочка встаёт и ходит вдоль мебели, — как раз предыдущий шаг перед самостоятельными шагами.

    Как поддержать:
    - давайте много времени свободно двигаться на полу, босиком;
    - каталки и толокары, которые можно толкать перед собой;
    - не используйте ходунки — они не ускоряют ходьбу и повышают риск травм;
    - протягивайте руки на небольшом расстоянии, чтобы она делала шаг к вам.

    Покажите её педиатру, если к 18 месяцам она не ходит самостоятельно, если заметна асимметрия (одна нога или рука работает хуже) или если она теряет навыки, которые уже были.

- id: ru-s010
  lang: ru
  profile: {age_months: 7, premature_weeks: 8}
  sources: [motor]
  question: "Сын родился на 2 месяца раньше срока, сейчас ему 7 месяцев, а он ещё не переворачивается. Это плохо?"
  answer: |
    Для недоношенных детей вехи развития до 2 лет оценивают по скорректированному возрасту. Ваш сын родился примерно на 8 недель раньше, поэтому его скорректированный возраст — около 5 месяцев. Переворот с живота на спину у большинства детей появляется к 6 месяцам по скорректированному возрасту, так что он пока укладывается в норму.

    Помогите ему:
    - больше времени на животе в бодрствовании;
    - кладите игрушку сбоку, чтобы он тянулся и поворачивался;
    - играйте на полу, а не в шезлонге или коляске.

    Недоношенных детей обычно наблюдают внимательнее, поэтому обсудите его развитие с педиатром на плановом осмотре. Если к 9 месяцам скорректированного возраста он не сидит с поддержкой или вы замечаете асимметрию движений, обратитесь раньше.

- id: ru-s011
  lang: ru
  profile: {age_months: 18}
  sources: [speech]
  question: "Сыну полтора года, говорит только \"мама\" и \"дай\". Нужно ли идти к логопеду?"
  answer: |
    Стоит обсудить это с педиатром, а при необходимости и с логопедом. К 18 месяцам большинство детей говорят три и больше слов, поэтому два слова — это немного меньше ожидаемого, хотя ещё не повод для паники.

    Важно посмотреть на картину в целом:
    - понимает ли он простые просьбы без жеста («принеси мяч»);
    - показывает ли пальцем, смотрит ли в глаза, откликается ли на имя;
    - хорошо ли реагирует на звуки — при задержке речи всегда стоит проверить слух.

    Дома помогают ежедневное чтение, комментирование всего, что вы делаете, и «расширение» его слов: он говорит «дай», вы — «дай машинку, синюю машинку». Если к 2 годам он не будет соединять два слова или теряет слова, которые уже говорил, обратитесь к специалисту без ожидания — ранняя помощь работает лучше всего.

- id: ru-s012
  lang: ru
  profile: {age_months: 6}
  sources: [speech]
  question: "Как развивать речь у ребёнка 6 месяцев, если он ещё совсем не говорит?"
  answer: |
    В 6 месяцев речь развивается через общение, а не через слова. Нормально, что малыш пока гулит, смеётся, визжит и «отвечает» звуками по очереди со взрослым.

    Что делать каждый день:
    - разговаривайте с ним лицом к лицу, повторяйте его звуки и ждите «ответа»;
    - комментируйте всё, что делаете: «Сейчас переоденем носочек»;
    - называйте то, на что он смотрит;
    - читайте книжки с крупными картинками, пойте песни и потешки;
    - играйте в «ку-ку».

    Экран не помогает развитию речи в этом возрасте — живое общение важнее любого «развивающего» видео. К 9 месяцам ждите лепета слогами («ба-ба», «ма-ма») и реакции на имя. Если к 12 месяцам нет лепета, жестов и отклика на имя, проконсультируйтесь с педиатром.

- id: ru-s013
  lang: ru
  profile: {age_months: 24, notes: [в семье говорят на казахском и русском]}
  sources: [bilingual, speech]
  question: "Мы говорим дома и на казахском, и на русском. Ребёнку 2 года, и он смешивает слова из двух языков. Может, лучше оставить один язык?"
  answer: |
    Нет, отказываться от одного языка не нужно. Смешивание слов из двух языков в одной фразе — нормальный этап у двуязычных детей: ребёнок использует все слова, которые знает. С возрастом он начнёт разделять языки в зависимости от собеседника.

    Двуязычие не вызывает задержку речи. Если сложить слова на казахском и русском, общий словарь двуязычного ребёнка обычно такой же или больше, чем у одноязычного.

    Что помогает:
    - «один родитель — один язык» или «дома один язык, на улице — другой»;
    - достаточно живого общения на каждом языке, хотя бы 25–30 % времени;
    - книги, песни и общение с родственниками на обоих языках;
    - если ребёнок отвечает на «другом» языке, просто повторите его фразу на своём.

    В 2 года ориентир — фразы из двух слов. Если их нет ни на одном языке, проконсультируйтесь со специалистом, но причина будет не в двуязычии.

- id: ru-s014
  lang: ru
  profile: {age_months: 15}
  sources: [screens]
  question: "Можно ли включать ребёнку 1 год 3 месяца мультики на 20 минут, чтобы я успела приготовить ужин?"
  answer: |
    Понимаю, как нужны эти 20 минут. По рекомендациям ВОЗ детям до 2 лет экранное время не рекомендуется, потому что в этом возрасте дети почти не учатся по видео, а экран вытесняет игру и общение.

    Альтернативы на время готовки:
    - посадите ребёнка рядом на безопасном расстоянии от плиты и дайте кастрюлю, ложки, пластиковые контейнеры;
    - ящик на кухне с «разрешёнными» вещами, которые можно доставать;
    - миска с водой и стаканчиками, крупная фасоль или макароны под присмотром;
    - разговаривайте с ним во время готовки: «Режу морковку, она оранжевая».

    Если иногда мультфильм всё же нужен, выберите спокойный медленный контент, не включайте его во время еды и перед сном и не делайте привычкой каждого дня. Видеозвонки с бабушкой и дедушкой при этом можно — это живое общение.

- id: ru-s015
  lang: ru
  profile: {age_months: 1}
  sources: [crying]
  question: "Ребёнку 6 недель, каждый вечер кричит по 3–4 часа, ничего не помогает. Это колики? Когда пройдёт?"
  answer: |
    Похоже на колики: долгий необъяснимый плач у здорового младенца больше 3 часов в день, чаще вечером. Пик плача обычно приходится как раз на 6–8 недель, а к 3–4 месяцам он заметно уменьшается.

    Что можно попробовать:
    - держать на руках, прижимая к себе, медленно покачивать или ходить;
    - плотное пеленание со свободными бёдрами и ровный «белый шум»;
    - положение на животе или боку на ваших руках (спать — только на спине);
    - тёплая ванна или прогулка в коляске;
    - если кормите грудью — давать дольше одну грудь.

    Если вы на пределе, положите малыша в кроватку на спину и выйдите на несколько минут — это безопасно. Никогда не трясите ребёнка. Срочно обратитесь к врачу, если появилась температура 38 °C и выше, вялость, зелёная рвота, кровь в стуле, отказ от еды или плач стал необычно высоким или слабым.

- id: ru-s016
  lang: ru
  profile: {age_months: 2}
  sources: [red_flags]
  question: "У дочки 2 месяцев температура 38,2. Она немного вялая. Можно подождать до утра?"
  answer: |
    Нет, ждать до утра не нужно. Температура 38 °C и выше у ребёнка младше 3 месяцев — это всегда повод для срочного осмотра врачом в тот же день, даже если других симптомов мало. Вялость — дополнительный тревожный признак.

    Что делать сейчас:
    - вызовите скорую (103 или 112) или срочно обратитесь в детскую больницу;
    - продолжайте предлагать грудь или смесь;
    - не кутайте ребёнка;
    - не давайте лекарства без указания врача.

    Вызывайте скорую немедленно, если она тяжело дышит, синеет, у неё судороги, её трудно разбудить или появилась сыпь, которая не бледнеет при надавливании стаканом.

- id: ru-s017
  lang: ru
  profile: {age_months: 20}
  sources: [red_flags]
  question: "Мой сын (1 год 8 месяцев) мог проглотить батарейку-таблетку от пульта, но ведёт себя нормально. Подождать, пока выйдет?"
  answer: |
    Нет, ждать нельзя. Вызывайте скорую (103 или 112) или немедленно везите сына в больницу прямо сейчас, даже если он выглядит нормально.

    Батарейка-таблетка, застрявшая в пищеводе, может вызвать тяжёлый химический ожог за 2 часа, а симптомов поначалу может не быть. Нужен срочный рентген, чтобы понять, где она находится.

    Пока едете:
    - не вызывайте рвоту;
    - не давайте есть и пить, если врач по телефону не сказал иначе;
    - возьмите с собой упаковку или пульт, если есть.

    На будущее храните пульты, весы и игрушки с такими батарейками так, чтобы отсек был закрыт винтом, а запасные батарейки — под замком.

- id: ru-s018
  lang: ru
  profile: {age_months: 11}
  sources: [red_flags]
  question: "Ребёнку 11 месяцев, третий день понос и рвота, писает мало. Чем его лечить дома?"
  answer: |
    При рвоте и поносе у ребёнка до года главное — не допустить обезвоживания, а то, что он мало писает, уже тревожный признак. Покажите его врачу сегодня.

    Признаки обезвоживания:
    - мало мокрых подгузников или нет мочи 6–8 часов;
    - сухой рот, плач без слёз;
    - запавший родничок, вялость, сонливость.

    Пока ждёте врача:
    - продолжайте грудное вскармливание или смесь, часто и понемногу;
    - давайте раствор для пероральной регидратации маленькими порциями (по чайной ложке каждые несколько минут), если рвота частая;
    - не давайте соки, газировку и противорвотные или противодиарейные лекарства без назначения врача.

    Вызывайте скорую (103 или 112), если ребёнок очень вялый, его трудно разбудить, рвота зелёная, в стуле кровь или он совсем не пьёт.

- id: ru-s019
  lang: ru
  profile: {age_months: 26}
  sources: [emotions]
  question: "Сыну 2 года 2 месяца, в магазине падает на пол и кричит, если я не покупаю игрушку. Как себя вести?"
  answer: |
    Истерики в 2 года — нормальная часть развития: желание самостоятельности уже большое, а умение справляться с сильными эмоциями ещё не созрело. Это не манипуляция в взрослом смысле.

    Во время истерики:
    - сохраняйте спокойствие, будьте рядом и следите за безопасностью;
    - назовите чувство: «Ты злишься, потому что очень хотел эту машинку»;
    - не покупайте игрушку, из-за которой началась истерика, но и не ругайте за саму эмоцию;
    - когда он успокоится, обнимите и коротко поговорите.

    Как снизить число истерик:
    - ходите в магазин, когда он сыт и выспался;
    - заранее договоритесь: «Сегодня покупаем хлеб и молоко, игрушки не покупаем»;
    - давайте ему задачу: положить яблоки в корзину;
    - предлагайте выбор из двух вариантов.

    Если истерики очень частые, длятся дольше 25 минут или он причиняет себе вред, обсудите это с педиатром.

- id: ru-s020
  lang: ru
  profile: {age_months: 9}
  sources: [emotions]
  question: "Дочке 9 месяцев, раньше шла ко всем на руки, а теперь плачет, если её берёт даже бабушка. Что случилось?"
  answer: |
    Скорее всего, ничего плохого: это страх незнакомых и тревога разлуки, которые обычно появляются около 8–10 месяцев. Ребёнок начинает хорошо отличать «своих» от «чужих» и сильнее привязывается к главному взрослому. Это признак здоровой привязанности.

    Как помочь:
    - не передавайте дочку бабушке сразу: пусть сначала посидит у вас на руках и привыкнет;
    - пусть бабушка заговорит с ней, предложит игрушку, а не тянет руки сразу;
    - прощаясь, уходите спокойно и коротко, не исчезайте тайком;
    - играйте в «ку-ку» — это помогает понять, что мама уходит и возвращается.

    Этот период проходит постепенно. Обратитесь к педиатру, если дочка вообще не смотрит в глаза, не улыбается вам в ответ или теряет навыки, которые уже были.

- id: ru-s021
  lang: ru
  profile: {age_months: 30}
  sources: [emotions]
  question: "Можно ли иногда шлёпнуть ребёнка, если он не слушается и бьёт других детей?"
  answer: |
    Шлёпать не рекомендуется. Физические наказания не учат ребёнка правильному поведению, а наоборот показывают, что силой можно решать конфликты, и со временем усиливают агрессию. Педиатрические ассоциации советуют отказаться от любых физических наказаний и крика.

    Что работает лучше, когда 2,5-летний ребёнок дерётся:
    - сразу и спокойно остановите руку: «Я не дам тебе бить»;
    - уведите его из ситуации на минуту-две и побудьте рядом, пока он не успокоится;
    - назовите чувство: «Ты разозлился, что он взял твою лопатку»;
    - покажите, что можно делать: попросить словами, позвать взрослого, топнуть ногой;
    - хвалите конкретно, когда он делится или просит словами.

    Правила должны быть простыми и одинаковыми у всех взрослых в семье. Если агрессия очень частая и не уменьшается, обсудите это с педиатром.

- id: ru-s022
  lang: ru
  profile: {age_months: 12}
  sources: [play]
  question: "Какие игры подходят ребёнку в 1 год? Не хочу покупать дорогие развивающие игрушки."
  answer: |
    В год дорогие игрушки не нужны — лучшая «развивающая игрушка» это вы. Вот что отлично работает:

    - Прятки и «ку-ку»: спрячьте игрушку под платок и дайте найти.
    - Сложить и вынуть: коробка, кастрюля, контейнеры с крышками, прищепки.
    - Стучать и шуметь: ложка и кастрюля, бутылка с крупой (крепко закрытая).
    - Катать мяч друг другу.
    - Пирамидки и большие кубики.
    - Каталки, которые можно толкать.
    - Книжки с картинками: называйте и спрашивайте «Где кошка?».
    - «Помощник»: протереть стол, положить носки в корзину.
    - Песенки с движениями, «ладушки».

    Следуйте за интересом ребёнка: если ему нравится открывать и закрывать дверцу шкафа, это и есть его игра сейчас. Занятия по 5–10 минут — нормально для этого возраста.

- id: ru-s023
  lang: ru
  profile: {age_months: 22}
  sources: [toilet]
  question: "Дочке 1 год 10 месяцев. В садике сказали, что пора приучать к горшку. С чего начать?"
  answer: |
    Сначала посмотрите, готова ли дочка: большинство детей готовы между 18 и 30 месяцами, но у каждого по-своему. Признаки готовности:
    - подгузник остаётся сухим 1,5–2 часа;
    - она показывает, что писает или какает;
    - ей неприятно в мокром подгузнике;
    - понимает простые просьбы и может спустить штанишки.

    Если признаки есть:
    1. Поставьте горшок заранее, дайте посидеть в одежде, «посадите» на него куклу.
    2. Предлагайте горшок после сна, после еды и перед прогулкой на 3–5 минут.
    3. Используйте одни и те же простые слова всей семьёй.
    4. Хвалите за попытки, а не только за результат.

    Не ругайте за «аварии» и не заставляйте сидеть долго. Если готовности пока нет, подождите пару месяцев — раннее начало обычно только растягивает процесс. Ночью сухо станет позже, это нормально.

- id: ru-s024
  lang: ru
  profile: {age_months: 7}
  sources: [teeth]
  question: "У сына 7 месяцев режутся зубы, температура 38,8 и понос. Это от зубов?"
  answer: |
    Скорее всего, нет. При прорезывании зубов возможно небольшое повышение температуры, слюнотечение и капризность, но температура 38 °C и выше и понос — признаки болезни, а не зубов. Здесь нужно искать другую причину.

    Что делать:
    - покажите сына педиатру сегодня;
    - чаще прикладывайте к груди или давайте смесь и питьё, следите за количеством мокрых подгузников;
    - не кутайте;
    - жаропонижающее давайте только по весу ребёнка и строго по инструкции.

    Срочно вызывайте скорую (103 или 112), если он вялый, его трудно разбудить, нет мочи 6–8 часов, тяжело дышит или появилась сыпь, не бледнеющая при надавливании стаканом.

- id: ru-s025
  lang: ru
  profile: {age_months: 12}
  sources: [teeth]
  question: "Нужно ли чистить зубы годовалому ребёнку и какой пастой?"
  answer: |
    Да, чистить нужно с первого зуба, два раза в день — утром и перед сном.

    - Щётка: мягкая детская, по возрасту.
    - Паста: с фтором, но очень маленькое количество — размером с рисовое зёрнышко до 3 лет, а с 3 лет — с горошину. Так ребёнок получает защиту от кариеса без риска проглотить лишнее.
    - После чистки не обязательно полоскать: достаточно сплюнуть остатки, если умеет.

    Ещё важно: не укладывайте спать с бутылочкой молока, смеси или сока — это главная причина раннего кариеса. Первый визит к стоматологу рекомендуют примерно к первому дню рождения, так что сейчас самое время.

- id: ru-s026
  lang: ru
  profile: {age_months: 10}
  sources: [safety]
  question: "Ребёнок начал ползать и вставать у мебели. Что дома сделать в первую очередь для безопасности?"
  answer: |
    Отличный момент, чтобы «пройти» по дому на уровне глаз ребёнка. В первую очередь:

    1. Закрепите к стене шкафы, комоды и телевизор — опрокидывание мебели очень опасно.
    2. Окна: ограничители открывания. Москитная сетка ребёнка не удерживает.
    3. Ворота на лестницы сверху и снизу.
    4. Лекарства, бытовая химия, капсулы для стирки — высоко и под замком.
    5. Мелкие предметы, монеты, батарейки-таблетки и магниты — убрать с пола и низких поверхностей.
    6. Розетки — заглушки, провода — спрятать.
    7. Горячее: ручки кастрюль к стене, без скатертей, горячий чай не рядом с ребёнком.
    8. Вода: не оставляйте одного в ванне ни на секунду, закрывайте крышку унитаза, опорожняйте вёдра.

    И главное правило — ребёнок в этом возрасте должен быть под присмотром взрослого, никакая защита этого не заменяет.

- id: ru-s027
  lang: ru
  profile: {age_months: 18}
  sources: [safety]
  question: "Ребёнку полтора года, хочу повернуть автокресло лицом вперёд, ему скучно. Можно?"
  answer: |
    Лучше подождать. Рекомендация — возить ребёнка лицом против хода движения как можно дольше: минимум до 2 лет, а лучше до максимального веса и роста, которые допускает ваше кресло в этом положении. При аварии в таком положении кресло лучше защищает голову и шею, которые у малыша ещё очень уязвимы.

    Проверьте инструкцию кресла: там указаны пределы веса и роста для положения против хода.

    Чтобы было не так скучно:
    - мягкие игрушки и книжки, которые не могут ударить при резком торможении;
    - песни и разговоры в дороге;
    - зеркало на подголовнике, чтобы вы видели друг друга.

    Длинные ноги, упирающиеся в спинку сиденья, сами по себе не повод поворачивать кресло — детям так обычно удобно.

- id: ru-s028
  lang: ru
  profile: {age_months: 5}
  sources: [feeding]
  question: "Сейчас жара +38, ребёнку 5 месяцев, он только на грудном молоке. Нужно ли допаивать водой?"
  answer: |
    Нет, если ребёнок на исключительно грудном вскармливании, вода ему не нужна даже в жару. Грудное молоко примерно на 88 % состоит из воды и полностью покрывает потребность в жидкости. Лишняя вода может заполнить желудок и уменьшить количество молока, которое малыш высасывает.

    В жару:
    - прикладывайте к груди чаще, по первому требованию;
    - одевайте легко, держите малыша в тени, проветривайте комнату;
    - следите за мокрыми подгузниками: их должно быть не меньше 6 в сутки.

    Если подгузников стало меньше, моча тёмная, рот сухой, ребёнок вялый или родничок запал — это признаки обезвоживания, покажите его врачу срочно. Если малыш на смеси, обсудите допаивание с педиатром.

- id: ru-s029
  lang: ru
  profile: {age_months: 3}
  sources: [play, speech]
  question: "Чем заниматься с ребёнком 3 месяцев, когда он не спит? Мне кажется, я делаю слишком мало."
  answer: |
    Скорее всего, вы делаете больше, чем думаете: в 3 месяца главное развитие идёт через обычное общение и уход.

    Простые занятия:
    - разговаривайте лицом к лицу на расстоянии 20–30 см, улыбайтесь, повторяйте его звуки и ждите «ответа»;
    - выкладывайте на живот несколько раз в день, можно на себя;
    - показывайте контрастные картинки, погремушку сбоку, чтобы он поворачивал голову;
    - пойте песни, носите на руках по дому и называйте предметы;
    - во время переодевания и купания — массаж и «потешки».

    Не нужно заполнять всё время бодрствования занятиями: если малыш отворачивается, хнычет или зевает, ему нужен отдых. Ваше внимание и отклик на его сигналы — это и есть самое важное «развитие».

- id: ru-s030
  lang: ru
  profile: {age_months: 34}
  sources: [screens]
  question: "Ребёнку почти 3 года. Сколько можно смотреть мультики в день?"
  answer: |
    Для детей 2–4 лет ВОЗ рекомендует не больше 1 часа экранного времени в день, и чем меньше, тем лучше.

    Как сделать экран полезнее:
    - выбирайте спокойный, медленный контент для этого возраста, на казахском или русском;
    - по возможности смотрите вместе и обсуждайте: «Почему зайчик грустный?»;
    - никаких экранов во время еды и за час до сна;
    - выключайте фоновый телевизор, когда никто не смотрит;
    - не используйте мультфильм как главный способ успокоить ребёнка.

    Важнее всего, чтобы экран не вытеснял игру, движение на улице, чтение и разговоры — в этом возрасте ребёнок учится в основном через них.

- id: ru-s031
  lang: ru
  profile: {age_months: 40}
  sources: []
  question: "Сыну 3 года и 4 месяца, как помочь ему подготовиться к школе и выучить буквы?"
  answer: |
    Я консультирую в основном по развитию детей от 0 до 3 лет, так что подскажу общие ориентиры.

    В 3 с небольшим года подготовка к школе — это не прописи и заучивание букв, а развитие речи, внимания и интереса к книгам:
    - читайте каждый день и обсуждайте прочитанное;
    - играйте в слова и рифмы, пойте песни;
    - если ребёнок сам интересуется буквами, показывайте их в игре: на вывесках, магнитах, в его имени;
    - рисование, лепка, конструктор развивают руку и мышление;
    - ролевые игры учат договариваться и выражать мысли.

    Давить и заставлять не нужно: в этом возрасте интерес важнее результата. Для более точного плана обратитесь к воспитателю или детскому психологу.

- id: ru-s032
  lang: ru
  profile: {age_months: 15}
  sources: []
  question: "Какое лекарство и в какой дозе дать ребёнку от кашля?"
  answer: |
    Я не могу назначать лекарства и дозировки — это должен сделать врач, который осмотрит ребёнка и учтёт его вес и симптомы. Многие средства от кашля и простуды детям младшего возраста вообще не рекомендуют.

    Что безопасно помогает при кашле на фоне простуды у ребёнка 1 года 3 месяцев:
    - больше питья;
    - промывание носа солевым раствором, особенно перед сном и едой;
    - увлажнённый прохладный воздух в комнате;
    - отдых.

    Мёд детям старше года при кашле допускается небольшим количеством, но обсудите это с педиатром.

    Обратитесь к врачу, если кашель длится больше 2–3 недель, есть высокая температура, ребёнок плохо пьёт. Вызывайте скорую (103 или 112), если он тяжело дышит, при вдохе втягиваются межрёберные промежутки, губы синеют или слышен свист.

- id: ru-s033
  lang: ru
  profile: {age_months: 0}
  sources: [feeding]
  question: "Ребёнку неделя. Как понять, что ему хватает моего молока?"
  answer: |
    Хороший вопрос — это беспокоит почти всех мам в первые недели. Ориентируйтесь на такие признаки:
    - после первой недели не меньше 6 мокрых подгузников в сутки;
    - регулярный стул, к концу первой недели он становится жёлтым;
    - стабильная прибавка веса по графику на осмотрах;
    - ребёнок активен между кормлениями, во время кормления слышно глотание.

    В первые дни частые кормления — 8–12 раз в сутки и иногда «подряд» — норма, а не признак нехватки молока. Чем чаще ребёнок сосёт, тем больше молока вырабатывается.

    Обратитесь к педиатру или консультанту по грудному вскармливанию, если мокрых подгузников мало, ребёнок очень сонливый и его трудно разбудить на кормление, кожа становится всё более жёлтой или вам больно кормить.

- id: ru-s034
  lang: ru
  profile: {age_months: 28, notes: [в садике говорят только по-русски]}
  sources: [bilingual]
  question: "Сын пошёл в русскоязычный садик и дома тоже перестал говорить по-казахски. Как сохранить казахский?"
  answer: |
    Это очень частая ситуация: язык садика быстро становится главным. Хорошая новость — в 2–3 года домашний язык ещё легко поддержать, если делать это последовательно.

    Что помогает:
    - Говорите с сыном по-казахски последовательно, даже если он отвечает по-русски. Не стыдите, просто повторите его фразу по-казахски.
    - Создайте ситуации, где казахский действительно нужен: звонки бабушке и дедушке, игры, песни, сказки перед сном.
    - Книги и аудиосказки на казахском, мультфильмы на казахском для этого возраста — в разумных пределах.
    - Хвалите за каждую попытку сказать по-казахски.
    - Ориентир — не меньше 25–30 % общения ребёнка на казахском.

    Двуязычие не мешает развитию речи, поэтому оба языка можно спокойно сохранять.

