  question: "Муж говорит, что если всё время брать сына на руки, мы его избалуем. Ему 4 месяца. Он прав?"
  answer: |
    Нет, младенца в первые месяцы невозможно избаловать руками и вниманием. Когда вы быстро и предсказуемо откликаетесь на плач — берёте на руки, утешаете, кормите — у ребёнка формируется надёжная привязанность. Такие дети потом чувствуют себя увереннее и легче исследуют мир.

    Плач в 4 месяца — его способ сказать, что ему нужно: голод, усталость, неудобство, желание быть рядом с вами.

    Вы можете постепенно давать ему возможность побыть на полу, на животе, поиграть с игрушкой, пока вы рядом — это тоже полезно. Но брать на руки, когда он плачет, — это правильно, а не баловство.

