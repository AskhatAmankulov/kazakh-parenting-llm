# Hand-written seed examples (Kazakh).

- id: kk-s001
  lang: kk
  profile: {age_months: 3}
  sources: [sleep]
  question: "Қызым 3 айлық, түнде 3–4 рет оянады. Бұл қалыпты ма, әлде тамағы жетпей ме?"
  answer: |
    Иә, 3 айлық нәресте үшін түнде бірнеше рет ояну — қалыпты жағдай. Бұл жаста тәуліктік ырғақ енді ғана қалыптасып жатыр, ал асқазаны кішкентай болғандықтан бала түнде де тамақтанғысы келеді. ДДСҰ бағдары бойынша 0–3 айлық бала тәулігіне жалпы 14–17 сағат ұйықтайды.

    Тамағы жететінін мына белгілер көрсетеді:
    - тәулігіне кемінде 6 дымқыл жөргек;
    - тексеру кезінде салмағының тұрақты қосылуы;
    - емізу аралығында сергек әрі белсенді болуы.

    Ұйқыны жақсартуға көмектеседі:
    - күндіз жарық пен қарым-қатынас көбірек, кешке күңгірт жарық пен тыныштық;
    - түнгі емізуді жарықты жақпай, сөйлеспей, тыныш өткізу;
    - қарапайым кешкі рәсім: шомылу, емізу, бесік жыры.

    Ал салмақ нашар қосылса немесе дымқыл жөргек аз болса, педиатрға қаралыңыз.

- id: kk-s002
  lang: kk
  profile: {age_months: 14}
  sources: [sleep]
  question: "Ұлым 1 жас 2 айлық, күндіз екі рет ұйықтайтын, енді екінші ұйқыдан бас тартып жүр. Не істеу керек?"
  answer: |
    Бұл қалыпты кезең. Көп бала шамамен 12–18 айда екі күндізгі ұйқыдан бір ұйқыға көшеді. Ауысу бірден емес, бірнеше апта ішінде біртіндеп болады.

    Қалай көмектесуге болады:
    - бір күндізгі ұйқыны түске қарай, шамамен 12:00–13:00-ге жылжытыңыз;
    - түскі асты сәл ертерек беріңіз, сонда бала тоқ әрі шаршаған күйде ұйықтайды;
    - екінші ұйқы болмаған күндері кешкі ұйқыны 30–60 минутқа ерте бастаңыз;
    - күндізгі ұйқы алдында тыныш ойындар, кітап.

    1–2 жастағы балаларға тәулігіне жалпы 11–14 сағат ұйқы керек. Егер ұлыңыз кешке қатты шаршап, жылауық болып жүрсе, әзірге кейбір күндері екі ұйқыны қалдыра тұруға болады.

- id: kk-s003
  lang: kk
  profile: {age_months: 2}
  sources: [sleep, safety]
  question: "Баланы өзіміздің төсекке жатқызып ұйықтатсақ болады ма? Солай емізу оңай."
  answer: |
    Түсінемін, түнде емізу үшін бұл ыңғайлы. Бірақ бір жасқа дейінгі нәресте үшін ең қауіпсіз нұсқа — сіздің бөлмеңізде, бірақ бөлек төсекте (бесікте) ұйықтау, әсіресе алғашқы 6 айда. Бұл нәрестенің кенеттен қайтыс болу синдромының қаупін азайтады.

    Бір төсекте ұйықтау әсіресе мына жағдайларда қауіпті:
    - ересек адам темекі шексе, ішімдік ішсе немесе тыныштандыратын дәрі қабылдаса;
    - ата-ана қатты шаршаған болса;
    - диванда немесе креслода ұйықтаса;
    - төсекте жұмсақ жастық пен көрпе болса.

    Ыңғайлы шешім — бесікті төсегіңіздің қасына қою: емізіп болған соң баланы бесікке шалқасынан жатқызасыз. Емізу кезінде ұйықтап кетуіңіз мүмкін болса, мұны диванда емес, төсекте жасаңыз және айналадан жастық пен көрпені алып тастаңыз.

- id: kk-s004
  lang: kk
  profile: {age_months: 6}
  sources: [feeding]
  question: "Балам 6 айлық болды. Қосымша тамақты неден бастаған дұрыс?"
  answer: |
    6 ай — қосымша тамақ бастауға дұрыс уақыт. Бұл кезде емшекпен емізуді жалғастыра беріңіз.

    Неден бастауға болады:
    - темірге бай өнімдер: ет езбесі (сиыр, тауық, күркетауық), байытылған ботқа, бұршақ;
    - көкөністер: кәді, гүлді қырыққабат, брокколи, асқабақ, сәбіз;
    - жемістер: алма, алмұрт, банан.

    Қалай беру керек:
    1. Біркелкі езбе немесе жақсы езілген жұмсақ тамақтан бастап, 1–2 шай қасықтан беріңіз.
    2. Бірте-бірте мөлшерін көбейтіп, консистенциясын қоюлатыңыз.
    3. Тұз бен қант қоспаңыз, шырын бермеңіз.
    4. 12 айға дейін бал беруге болмайды.
    5. Баланың тоқтық белгілерін құрметтеңіз, мәжбүрлемеңіз.

    Жаңа дәмді бала бірден ұнатпауы мүмкін — оны 8–15 рет ұсыну қалыпты. Ауыр экзема немесе аллергия болса, аллергиялық өнімдерді енгізуді педиатрмен келісіңіз.

- id: kk-s005
  lang: kk
  profile: {age_months: 10}
  sources: [feeding]
  question: "10 айлық балаға сиыр сүтін беруге бола ма? Емшек сүтім азайып кетті."
  answer: |
    12 айға дейін сиыр сүтін негізгі сусын ретінде беруге болмайды: онда темір аз, ал ақуыз бен тұз нәресте бүйрегіне ауыр. Бұл темір тапшылығы анемиясының қаупін арттырады.

    Не істеуге болады:
    - емшек сүті азайса, баланы жиірек емізіп көріңіз — сүт сұранысқа қарай өндіріледі;
    - қосымша қажет болса, жасына сай балалар сүт қоспасын беріңіз;
    - аздаған мөлшерде сиыр сүтін ботқа мен тамақтың құрамында қолдануға болады;
    - айран, йогурт, ірімшік сияқты сүт өнімдері 6 айдан кейін рационда бола алады.

    Бір жастан кейін бала тұтас сиыр сүтін іше бастай алады. Сүт азаюы сізді алаңдатса, емшекпен емізу жөніндегі кеңесшіге немесе педиатрға жүгініңіз.

- id: kk-s006
  lang: kk
  profile: {age_months: 18}
  sources: [feeding]
  question: "Ұлым 1,5 жаста, тек нан мен макарон жейді, көкөністі мүлде жемейді. Не істеймін?"
  answer: |
    Бұл жаста тағамды таңдап жеу — өте жиі кездесетін әрі көбіне уақытша жағдай. Балалар жаңа тағамнан сақтанады, сондықтан оны көп рет ұсыну керек.

    Көмектесетін тәсілдер:
    - көкөністі әр тамақта аздап, ұнайтын тағамының қасына қойыңыз, жеуге мәжбүрлемеңіз;
    - бір өнімді 8–15 рет ұсынуға дайын болыңыз;
    - баламен бірге отырып, өзіңіз де сол көкөністі жеңіз — ол сізге еліктейді;
    - көкөністі макаронға, котлетке, сорпаға қосыңыз;
    - баланы дайындауға тартыңыз: жуу, араластыру;
    - тамақ кезінде мультфильм қоспаңыз.

    Тоқтық белгілерін құрметтеңіз: «тағы бір қасық» деп қыстамаңыз. Егер ұлыңыз салмақ қоспаса, әлсіз болса немесе тағамның тым аз түрін ғана жесе, педиатрмен ақылдасыңыз.

- id: kk-s007
  lang: kk
  profile: {age_months: 9}
  sources: [motor]
  question: "Қызым 9 айлық, әлі еңбектемейді, тек отырады. Бұл дұрыс па?"
  answer: |
    Иә, бұл қалыпты болуы мүмкін. Кейбір балалар еңбектемей, отырудан бірден тұруға және жүруге көшеді, ал кейбірі отырып жылжиды. Еңбектеу міндетті кезең емес.

    9 айдағы маңызды бағдарлар:
    - сүйеусіз отыру;
    - өздігінен отыра алу;
    - заттарды бір қолдан екінші қолға ауыстыру.

    Қызыңыз сүйеусіз отырса, бұл жақсы белгі. Қозғалысты қолдау үшін:
    - еденде еркін ойнауға көп уақыт беріңіз;
    - ойыншықты қолы жетпейтін жерге қойып, оған ұмтылуға ынталандырыңыз;
    - етпетінен жатып ойнауды жалғастырыңыз.

    Егер ол 9 айда сүйеумен де отырмаса, денесінің бір жағын жиі қолданса немесе бұрын болған дағдыларын жоғалтса, педиатрға көрсетіңіз.

- id: kk-s008
  lang: kk
  profile: {age_months: 11}
  sources: [motor, safety]
  question: "Жүргізгіш (ходунки) алсақ, балам тезірек жүріп кете ме?"
  answer: |
    Жоқ, жүргізгіш жүруді тездетпейді, керісінше кейде оны кешіктіруі мүмкін. Онымен бала тепе-теңдікті сақтауды және дұрыс қадам басуды үйренбейді. Оның үстіне жүргізгіштер жарақат қаупін арттырады: бала баспалдақтан құлап, ыстық заттарға немесе қауіпті заттарға қол жеткізе алады. Сондықтан педиатрлар оларды ұсынбайды.

    11 айлық баланың жүруіне не көмектеседі:
    - еденде, жалаң аяқ еркін қозғалу;
    - алдына итеріп жүретін тұрақты ойыншықтар (арба, толокар);
    - жиһазды ұстап жүруге қауіпсіз орта;
    - қолыңызды созып, баланы өзіңізге қарай бір-екі қадам жасауға ынталандыру.

    Өздігінен жүрудің қалыпты жасы — шамамен 8–18 ай, сондықтан асығудың қажеті жоқ.

- id: kk-s009
  lang: kk
  profile: {age_months: 24}
  sources: [motor]
  question: "Ұлым 2 жаста, жиі сүрініп құлайды, басқа балалардан ебедейсіз сияқты. Алаңдау керек пе?"
  answer: |
    2 жаста сүрініп құлау жиі кездеседі: бала жаңа ғана жүгіре бастады, ал тепе-теңдік әлі жетілу үстінде. Бұл жастағы бағдарлар — жүгіру, допты тебу, бірнеше баспалдаққа көтерілу.

    Қозғалысты дамытуға көмектеседі:
    - алаңда күн сайын жүгіру, өрмелеу, доп ойнау;
    - тегіс емес жерде жүру: шөп, құм;
    - күніне кемінде 180 минут түрлі белсенділік.

    Педиатрға көрсетіңіз, егер:
    - ол бұрын жақсы жасаған қимылдарын жоғалтса;
    - бір аяғын немесе қолын басқасынан нашар қолданса;
    - аяқтың ұшымен ғана жүрсе немесе тым жиі және себепсіз құласа;
    - құлағаннан кейін ұзақ ақсаса.

- id: kk-s010
  lang: kk
  profile: {age_months: 20}
  sources: [speech]
  question: "Қызым 1 жас 8 айлық, бірнеше сөз ғана айтады, бірақ бәрін түсінеді. Логопедке бару керек пе?"
  answer: |
    Қызыңыздың бәрін түсінуі — өте жақсы белгі. 18 айда балалардың көбі кемінде үш сөз айтады, ал 2 жасқа қарай екі сөзді біріктіре бастайды («апа бер», «тағы су»). Егер қызыңыз бірнеше сөз айтып, өтініштерді түсініп, саусағымен көрсетіп, көзге қарап сөйлессе, әзірге бақылап, үйде көбірек сөйлесуге болады.

    Үйде көмектеседі:
    - не істеп жатқаныңызды күні бойы айтып отыру;
    - оның сөзін кеңейту: ол «доп» десе, сіз «иә, үлкен қызыл доп»;
    - күн сайын кітап оқу және сұрақ қою: «Мысық қайда?»;
    - жауап беруіне уақыт қалдыру.

    Егер 2 жасқа қарай ол екі сөзді біріктірмесе, сөздерін жоғалтса немесе дыбыстарға нашар жауап берсе, педиатрға немесе логопедке қаралыңыз. Есту қабілетін тексеру де пайдалы.

- id: kk-s011
  lang: kk
  profile: {age_months: 12}
  sources: [speech]
  question: "Балам бір жаста, әлі «апа» деп айтпайды, тек «ба-ба» дейді. Қалыпты ма?"
  answer: |
    Бір жаста балалардың көбі «апа» немесе «әке» сияқты сөзді мағыналы түрде айта бастайды, бірақ оның уақыты әртүрлі. «Ба-ба» деп былдырлауы — сөйлеуге дейінгі маңызды кезең.

    Мына белгілерге назар аударыңыз:
    - атына жауап бере ме;
    - «сау бол» деп қол бұлғай ма, саусағымен көрсете ме;
    - «болмайды» сөзін түсіне ме;
    - сізбен кезектесіп дыбыс шығара ма.

    Бұлар болса, бәрі дұрыс жолда. Сөйлеуді дамыту үшін көп сөйлесіңіз, заттарды атаңыз, кітап оқыңыз, ән айтыңыз.

    Егер 12 айда былдырламаса, ыммен көрсетпесе және атына жауап бермесе, немесе 16–18 айда бірде-бір сөз айтпаса, педиатрға қаралыңыз.

- id: kk-s012
  lang: kk
  profile: {age_months: 30, notes: [үйде қазақша, балабақшада орысша]}
  sources: [bilingual]
  question: "Үйде қазақша сөйлейміз, балабақша орысша. Балам екі тілді араластырады. Оны шатастырып алмаймыз ба?"
  answer: |
    Жоқ, шатастырмайсыздар. Екі тілді араластыру — қостілді балалардағы қалыпты кезең. Бала бір сөйлемде өзі білетін барлық сөзді қолданады, ал жасы ұлғайған сайын тілдерді әңгімелесушіге қарай ажырата бастайды.

    Зерттеулер көрсеткендей, қостілділік сөйлеуді кешеуілдетпейді. Екі тілдегі сөздерді қосқанда қостілді баланың сөздік қоры бір тілді баланыкімен бірдей немесе көбірек болады.

    Сіздердің «үйде — қазақша, балабақшада — орысша» тәсілдеріңіз жақсы жұмыс істейді. Тек үйде қазақ тілін жүйелі сақтаңыз:
    - бала орысша жауап берсе, ұялтпай, оның сөзін қазақша қайталаңыз;
    - қазақша кітап, ән, ертегі көбірек болсын;
    - ата-әжемен қазақша сөйлесуге мүмкіндік жасаңыз.

- id: kk-s013
  lang: kk
  profile: {age_months: 10}
  sources: [screens]
  question: "Балам тамақ жегенде тек телефондағы мультфильммен ғана жейді. Бұл зиян ба?"
  answer: |
    Иә, бұл әдетті бірте-бірте өзгерткен дұрыс. ДДСҰ 2 жасқа дейінгі балаларға экран уақытын ұсынбайды. Ал тамақ кезіндегі мультфильмнің тағы бір зияны бар: бала аштық пен тоқтық белгілерін сезінуді үйренбейді, тамақтың дәмі мен түріне назар аудармайды және артық жеуі мүмкін.

    Қалай өзгертуге болады:
    - баламен бірге отырып тамақтаныңыз, оған сөйлеп, тамақты атаңыз;
    - баланың өзі саусағымен алып жейтін тамақ беріңіз — бұл қызықты;
    - алғашқы күндері аз жесе, уайымдамаңыз: дені сау бала аш қалмайды;
    - тамаққа қызықтыру үшін ойыншықты орындықтың қасына қоюға болады, бірақ экран емес.

    Алғашқы бірнеше күн бала наразылық білдіруі мүмкін — бұл қалыпты. Жүйелі болсаңыз, әдет 1–2 аптада өзгереді.

- id: kk-s014
  lang: kk
  profile: {age_months: 1}
  sources: [crying]
  question: "Ұлым 5 апталық, кешке 2–3 сағат тоқтамай жылайды. Не істесем болады?"
  answer: |
    Бұл колика болуы мүмкін: дені сау нәрестенің күніне 3 сағаттан артық, көбіне кешке түсініксіз жылауы. Жылау әдетте 6–8 аптада ең көп болады, ал 3–4 айға қарай айтарлықтай азаяды.

    Не көмектесуі мүмкін:
    - аштықты, жөргекті, бөлме температурасын тексеру;
    - баланы өзіңізге басып ұстап, баяу тербету немесе онымен жүру;
    - жамбасы еркін болатындай тығыз орау және «ш-ш-ш» деген бірқалыпты дыбыс;
    - қолыңызда бүйірінен немесе етпетінен ұстау (ұйықтағанда — тек шалқасынан);
    - жылы ванна немесе арбамен серуен.

    Шаршасаңыз, баланы бесікке шалқасынан жатқызып, бірнеше минут демалыңыз — бұл қауіпсіз. Баланы ешқашан сілкімеңіз.

    Егер 38 °C немесе одан жоғары қызу, әлсіздік, жасыл құсу, нәжісте қан, тамақтан бас тарту болса, дереу дәрігерге жүгініңіз.

- id: kk-s015
  lang: kk
  profile: {age_months: 8}
  sources: [red_flags]
  question: "8 айлық баламның денесінде ұсақ қызыл нүктелер пайда болды, қызуы да бар. Стақанмен басқанда жоғалмайды."
  answer: |
    Бұл шұғыл жағдай. Қызумен бірге шыны стақанмен басқанда бозармайтын ұсақ қызыл нүктелер ауыр инфекцияның, соның ішінде менингококк инфекциясының белгісі болуы мүмкін.

    Дәл қазір жедел жәрдем шақырыңыз (103 немесе 112) немесе баланы бірден ауруханаға апарыңыз. Күтпеңіз, басқа белгілердің пайда болуын бақыламаңыз.

    Жедел жәрдемді күтіп отырғанда:
    - баланың тынысын және жағдайын бақылаңыз;
    - оны қалың орамаңыз;
    - дәрігерге қызудың қашан басталғанын және бөртпенің қашан пайда болғанын айтыңыз.

- id: kk-s016
  lang: kk
  profile: {age_months: 15}
  sources: [red_flags]
  question: "Балам диваннан құлап, басын соғып алды. Жылады, қазір ойнап жүр. Не байқау керек?"
  answer: |
    Құлағаннан кейін бірден жылап, содан кейін әдеттегідей ойнай бастауы — жақсы белгі. Дегенмен келесі 24 сағат бойы баланы мұқият бақылаңыз.

    Жедел жәрдем шақырыңыз (103 немесе 112), егер:
    - бала есінен танса немесе оны ояту қиын болса;
    - бірнеше рет құсса;
    - әдеттен тыс ұйқышыл, әлсіз немесе мінез-құлқы өзгерсе;
    - құрысу болса;
    - құлағынан немесе мұрнынан қан не мөлдір сұйықтық ақса;
    - басында үлкен ісік болса немесе еңбегі томпайса;
    - жүруі, тепе-теңдігі өзгерсе.

    Бала әдеттегі уақытта ұйықтай алады, бірақ алғашқы түнде бір-екі рет тексеріп, оның қалыпты оянатынына көз жеткізіңіз. Диваннан құлаудың алдын алу үшін баланы биік жерде жалғыз қалдырмаңыз.

- id: kk-s017
  lang: kk
  profile: {age_months: 5}
  sources: [red_flags]
  question: "5 айлық баламның қызуы 38,5. Қызу түсіретін дәрі беру керек пе?"
  answer: |
    Қызу — организмнің инфекцияға жауабы, өздігінен зиян келтірмейді. Ең маңыздысы — баланың жалпы жағдайы.

    Үйде:
    - емшекті немесе қоспаны жиірек ұсыныңыз;
    - қалың орамаңыз;
    - бала нашар сезінсе, қызу түсіретін дәріні (парацетамол немесе ибупрофен) тек баланың салмағына қарай қатаң нұсқаулық бойынша беруге болады; аспирин беруге болмайды;
    - спиртпен, сірке сумен сүртпеңіз.

    3–6 айлық балада 39 °C және одан жоғары қызу болса, сол күні дәрігерге қаралу керек. 38,5 болса да, бала әлсіз болса, тамақтан бас тартса, дымқыл жөргек азайса немесе қызу 3 күннен ұзақ созылса, дәрігерге көрсетіңіз.

    Дереу жедел жәрдем шақырыңыз (103 немесе 112), егер тынысы қиындаса, құрысу болса, оны ояту қиын болса немесе басқанда бозармайтын бөртпе пайда болса.

- id: kk-s018
  lang: kk
  profile: {age_months: 32}
  sources: [emotions]
  question: "Қызым 2,5 жаста, ұйықтар алдында күнде ашуланып, жылап, айқайлайды. Қалай тоқтатамын?"
  answer: |
    Ұйқы алдындағы ашу-ыза 2–3 жаста жиі болады: бала шаршаған, ал күшті эмоцияларды басқару әлі қиын. Бұл қалыпты, оны біртіндеп жеңілдетуге болады.

    Ашу-ыза кезінде:
    - сабыр сақтап, қасында болыңыз;
    - сезімін атаңыз: «Сен әлі ойнағың келеді, сондықтан ренжіп тұрсың»;
    - ұйықтау ережесін өзгертпеңіз, бірақ эмоция үшін жазаламаңыз.

    Алдын алу үшін:
    - күнде бір уақытта, бірдей тәртіппен жатқызыңыз: шомылу, пижама, кітап, бесік жыры;
    - ұйқыдан 10 минут бұрын ескертіңіз: «Тағы бір ойын, сосын жуынамыз»;
    - таңдау беріңіз: «Қай пижаманы киесің?», «Қай кітапты оқимыз?»;
    - ұйқыдан бір сағат бұрын экранды өшіріңіз;
    - күндізгі ұйқы тым кеш болмасын.

    Ашу-ыза күніне бірнеше рет, 25 минуттан ұзақ болса немесе қызыңыз өзіне зиян келтірсе, педиатрмен ақылдасыңыз.

- id: kk-s019
  lang: kk
  profile: {age_months: 18}
  sources: [emotions]
  question: "Ұлым 1,5 жаста, балабақшаға бергенде қатты жылайды, мені жібергісі келмейді. Қалай көмектесемін?"
  answer: |
    Бұл жаста ата-анадан айырылғанда мазасыздану — қалыпты жағдай және сенімді бауыр басудың белгісі. Көп бала жаңа ортаға бірнеше аптада бейімделеді.

    Көмектесетін тәсілдер:
    - бастапқыда балабақшада аз уақыт болыңыз, уақытты біртіндеп көбейтіңіз;
    - қоштасуды қысқа әрі бірдей етіңіз: құшақтау, «Түстен кейін келемін» деу, кету;
    - жасырын кетіп қалмаңыз — бұл сенімді бұзады;
    - үйден таныс зат беріңіз: сүйікті ойыншық немесе орамал;
    - уәде еткен уақытта келіңіз;
    - тәрбиешімен сөйлесіп, бала қанша уақытта тынышталатынын біліңіз.

    Көбіне бала ата-ана кеткен соң бірнеше минутта тынышталады. Егер апталар өтсе де жағдай жақсармаса, ұйқысы мен тәбеті қатты бұзылса, педиатрмен немесе балалар психологымен ақылдасыңыз.

- id: kk-s020
  lang: kk
  profile: {age_months: 8}
  sources: [play]
  question: "8 айлық баламен үйде қандай ойын ойнауға болады?"
  answer: |
    8 айда бала заттарды зерттеуді, жасырын заттарды іздеуді және сізбен кезектесіп ойнауды жақсы көреді. Қымбат ойыншықтар қажет емес.

    Ойындар:
    - «Ку-ку»: бетіңізді алақаныңызбен жасырып, қайта көрсетіңіз;
    - ойыншықты орамалдың астына жасырып, тауып алуды ұсыныңыз;
    - заттарды қорапқа салу және шығару;
    - қасықпен кастрөлді тықылдату;
    - бір-біріңізге доп домалату;
    - ойыншықты сәл алысқа қойып, оған еңбектеуге немесе ұмтылуға ынталандыру;
    - «алақай», «сау бол» сияқты ымдарды қайталау;
    - суретті кітаптарды бірге қарап, заттарды атау.

    Ойын кезінде баланың қызығушылығына еріңіз, ол шаршаса, демалуға мүмкіндік беріңіз.

- id: kk-s021
  lang: kk
  profile: {age_months: 27}
  sources: [play]
  question: "2 жастағы баланы үйде қалай дамытуға болады? Бізде көп ойыншық жоқ."
  answer: |
    2–3 жаста бала ойын арқылы сөйлеуді, ойлауды және басқалармен араласуды үйренеді. Көп ойыншық қажет емес, қарапайым заттар жетеді.

    Идеялар:
    - Рөлдік ойындар: қуыршақты тамақтандыру, «дүкен», «дәрігер», кастрөлмен «ас пісіру».
    - Сұрыптау: шұлықтарды жұбымен, қасықтарды өлшемі бойынша, түймелерді (бақылаумен) түсі бойынша.
    - Сурет салу және мүсіндеу: бор, қамыр, ермексаз.
    - Қораптардан мұнара, үй, пойыз жасау.
    - Үй шаруасына көмек: көкөніс жуу, кір жинау.
    - Сыртта: жүгіру, доп, құм, өрмелеу.
    - Күн сайын кітап және қимылмен айтылатын әндер.

    Ойын 5–10 минуттан аспаса да қалыпты. Баланың байқап көруіне, қателесуіне мүмкіндік беріп, тек қажет болса көмектесіңіз.

- id: kk-s022
  lang: kk
  profile: {age_months: 26}
  sources: [toilet]
  question: "Ұлымды түбекке үйретіп жүрміз, бірақ ол түбекке отырудан қорқады және жылайды. Не істейміз?"
  answer: |
    Мұндай жағдай жиі болады. Ең бастысы — қысым жасамау, әйтпесе қорқыныш күшейе түседі.

    Көмектесетін тәсілдер:
    - бірнеше күнге үзіліс жасаңыз, түбекті тек ойыншық сияқты көрінетін жерде қалдырыңыз;
    - алдымен ұлыңыз түбекке киіммен отырып көрсін, қуыршаққа немесе аюға «көрсетсін»;
    - түбекке аяғы еденге тиетіндей ыңғайлы болсын;
    - түбекте отырғанда кітап оқыңыз немесе ән айтыңыз;
    - талпынысы үшін мадақтаңыз, «апат» үшін ұрыспаңыз;
    - түбекті ұйқыдан кейін, тамақтан кейін 3–5 минутқа ғана ұсыныңыз.

    Егер ол әлі дайын болмаса, бір-екі айға кейінге қалдыру қалыпты — тым ерте бастау процесті ұзартады. Үлкен дәретке шығу ауырса немесе іші жиі қатса, педиатрға қаралыңыз, себебі ауырсыну да қорқыныш тудыруы мүмкін.

- id: kk-s023
  lang: kk
  profile: {age_months: 6}
  sources: [teeth]
  question: "Баламның тісі шығып жатыр, қызыл иегіне жағатын гель беруге бола ма?"
  answer: |
    Нәрестелерге бензокаин немесе лидокаин бар гельдерді қолданбаған дұрыс: олар қауіпті болуы мүмкін және пайдасы аз. Сондай-ақ тіс шығуға арналған кәріптас моншақтарды тақпаңыз — тұншығу қаупі бар.

    Не көмектеседі:
    - тоңазытқышта салқындатылған (мұздатылмаған) тіс шығаратын сақина;
    - қызыл иекті таза саусақпен уқалау;
    - бала қатты мазасызданса — салмағына қарай нұсқаулық бойынша қызу түсіретін-ауырсынуды басатын дәрі.

    Тіс шыққанда сілекей ағуы, ашушаңдық, мазасыз ұйқы болуы мүмкін. Бірақ 38 °C және одан жоғары қызу, іш өту немесе бөртпе — тістің емес, аурудың белгісі, бұл жағдайда дәрігерге қаралыңыз.

- id: kk-s024
  lang: kk
  profile: {age_months: 17}
  sources: [teeth]
  question: "Қызым 1 жас 5 айлық, түнде бөтелкемен сүт ішіп ұйықтайды. Тісіне зиян ба?"
  answer: |
    Иә, бұл әдет ерте тіс жегісінің басты себебі. Ұйқы кезінде сілекей аз бөлінеді, ал сүттегі қант тістің бетінде ұзақ қалып, тіс жегісін тудырады.

    Қалай өзгертуге болады:
    - сүтті ұйқы рәсімінің басына жылжытыңыз, содан кейін тіс тазалаңыз;
    - ұйқыға бөтелкесіз жатқызыңыз, оның орнына кітап, бесік жыры, сүйікті ойыншық;
    - түнде шөлдесе, тек таза су беріңіз;
    - өзгерісті бірте-бірте жасаңыз: бөтелкедегі сүт мөлшерін бірнеше күнде азайтыңыз.

    Тісті күніне екі рет, күріш дәніндей мөлшердегі фторлы пастамен тазалаңыз. Егер әлі стоматологқа бармаған болсаңыз, қазір бару уақыты келді.

- id: kk-s025
  lang: kk
  profile: {age_months: 13}
  sources: [safety]
  question: "Балам дәрі қорабын ашып, бір-екі таблетка жұтып қойған сияқты. Не істеймін?"
  answer: |
    Бұл шұғыл жағдай. Бала өзін жақсы сезінсе де, күтпеңіз:
    - дереу жедел жәрдем шақырыңыз (103 немесе 112) немесе баланы бірден ауруханаға апарыңыз;
    - дәрінің қорабын немесе қаптамасын өзіңізбен бірге алыңыз — дәрігерге қандай дәрі және қанша жұтқаны маңызды;
    - дәрігер айтпаса, құстыруға тырыспаңыз;
    - баланың тынысын және санасын бақылаңыз.

    Кейбір дәрілер аз мөлшердің өзінде балаға өте қауіпті, ал белгілері бірнеше сағаттан кейін ғана пайда болуы мүмкін.

    Болашақта дәрі-дәрмекті, тұрмыстық химияны және кір жуатын капсулаларды биікте, құлыптаулы жерде сақтаңыз.

- id: kk-s026
  lang: kk
  profile: {age_months: 4}
  sources: [safety]
  question: "Баланы ваннаға шомылдырып жатқанда телефон шырылдаса, бір минутқа шығып кетсем бола ма?"
  answer: |
    Жоқ, баланы ваннада бір минутқа да, тіпті арнайы орындықта да жалғыз қалдыруға болмайды. Бала бірнеше сантиметр суға бірнеше секундта және дыбыссыз батып кетуі мүмкін.

    Қауіпсіз шомылдыру:
    - бәрін алдын ала дайындаңыз: орамал, киім, жөргек қолыңыздың астында болсын;
    - телефонға жауап беру керек болса, баланы орамалға орап, өзіңізбен бірге алып шығыңыз;
    - бақылауды үлкен балаларға тапсырмаңыз;
    - су температурасы шамамен 37 °C болсын;
    - шомылдырып болған соң суды бірден төгіңіз.

- id: kk-s027
  lang: kk
  profile: {age_months: 0}
  sources: [feeding]
  question: "Жаңа туған балам емшекті жиі сұрайды, сағат сайын дерлік. Сүтім жетпей ме?"
  answer: |
    Көбіне жоқ. Жаңа туған нәресте үшін тәулігіне 8–12 рет, кейде одан да жиі еміп, кейбір сағаттарда «тізбектеп» емуі — қалыпты жағдай. Асқазаны өте кішкентай, ал жиі емізу сүт өндіруді арттырады: бала неғұрлым көп емсе, сүт соғұрлым көп келеді.

    Сүт жеткілікті екенін көрсететін белгілер:
    - бірінші аптадан кейін тәулігіне кемінде 6 дымқыл жөргек;
    - тұрақты нәжіс;
    - тексеру кезінде салмақтың қосылуы;
    - емізгенде жұтқан дыбыстың естілуі.

    Егер дымқыл жөргек аз болса, бала тым ұйқышыл болса және емізуге ояту қиын болса, терісі барған сайын сарғайса немесе емізу ауыр болса, педиатрға немесе емшекпен емізу жөніндегі кеңесшіге жүгініңіз.

- id: kk-s028
  lang: kk
  profile: {age_months: 3}
  sources: [motor, play]
  question: "3 айлық баланы етпетінен жатқызғанда жылайды. Жатқызбай-ақ қойсақ бола ма?"
  answer: |
    Етпетінен жатуды мүлде тоқтатпаған жөн, себебі ол мойын, арқа және иық бұлшықеттерін нығайтады, кейін аунауға, отыруға және еңбектеуге дайындайды. Бірақ оны баланың көңіліне қарай жеңілдетуге болады.

    Кеңестер:
    - қысқа уақытпен бастаңыз: 1–3 минуттан күніне бірнеше рет;
    - баланы өз кеудеңізге етпетінен жатқызып, онымен сөйлесіңіз;
    - алдына жарқын ойыншық немесе айна қойыңыз;
    - еденде онымен бетпе-бет жатыңыз;
    - тамақтан кейін бірден емес, бала тоқ әрі сергек кезде жатқызыңыз.

    ДДСҰ бағдары — ояу кезде күніне жалпы кемінде 30 минут етпетінен жату. Ұйықтағанда баланы тек шалқасынан жатқызыңыз.

- id: kk-s029
  lang: kk
  profile: {age_months: 40}
  sources: []
  question: "3,5 жастағы балам кешке тісін тазалағысы келмейді, қалай көндіруге болады?"
  answer: |
    Мен негізінен 0–3 жастағы балалардың дамуы бойынша кеңес беремін, бірақ бұл жағдайға арналған жалпы кеңестер бар.

    - Тіс тазалауды ойынға айналдырыңыз: «тістердегі микробтарды қуамыз», 2 минуттық ән.
    - Таңдау беріңіз: «Көк щетка ма, жасыл ма?».
    - Алдымен бала өзі тазаласын, содан кейін сіз «тексеріп» тазалап беріңіз.
    - Ойыншыққа тісін тазалап көрсетсін.
    - Күнде бір уақытта, бірдей тәртіппен жасаңыз.

    3 жастан бастап фторлы паста бұршақтай мөлшерде беріледі. Бала қарсылықты ұзақ уақыт жалғастырса немесе тіс ауырса, балалар стоматологына көрсетіңіз.

- id: kk-s030
  lang: kk
  profile: {age_months: 20}
  sources: []
  question: "Баламның жөтеліне қандай антибиотик беру керек?"
  answer: |
    Антибиотикті тек дәрігер баланы қарап шыққаннан кейін тағайындай алады — мен дәрі тағайындамаймын. Көптеген жөтел вирустан болады, ал вирусқа антибиотик әсер етпейді және пайдасыз кейде зиян келтіреді.

    Үйде көмектесетін қауіпсіз тәсілдер:
    - көп сусын;
    - мұрынды тұзды ерітіндімен жуу;
    - бөлмедегі ылғалды, салқын ауа;
    - демалыс.

    Дәрігерге қаралыңыз, егер жөтел 2–3 аптадан ұзақ созылса, жоғары қызу болса, бала нашар ішсе. Жедел жәрдем шақырыңыз (103 немесе 112), егер тынысы қиындаса, тыныс алғанда қабырға аралығы ішке тартылса, ерні көгерсе немесе ысқырып дем алса.

- id: kk-s031
  lang: kk
  profile: {age_months: 22, notes: [ата-анасы орысша, әжесі қазақша сөйлейді]}
  sources: [bilingual, speech]
  question: "Біз үйде орысша сөйлейміз, бірақ баламның қазақ тілін де білгенін қалаймыз. Неден бастаймыз?"
  answer: |
    Ерте жаста екінші тілді үйрету — өте жақсы шешім, қостілділік сөйлеуді кешеуілдетпейді.

    Неден бастауға болады:
    - Тұрақты «қазақ тілі адамын» табыңыз: әжесімен әрдайым қазақша сөйлесу — керемет мүмкіндік. Әжесі баламен тек қазақша сөйлесін.
    - «Уақыт пен орын» тәсілі: мысалы, кешкі кітап пен ертегі тек қазақша.
    - Қазақша әндер, тақпақтар, аудиоертегілер.
    - Қазақ тілді балалармен ойын, балабақша немесе үйірме.
    - Өзіңіз білетін қазақша сөздерді күнделікті жағдайларда қолданыңыз: тамақ, киім, серуен.

    Тілді белсенді меңгеру үшін баланың қарым-қатынас уақытының кемінде 25–30 %-ы сол тілде өткені жақсы. Бала екі тілді араластырса — бұл қалыпты.

- id: kk-s032
  lang: kk
  profile: {age_months: 7}
  sources: [emotions, crying]
  question: "Қайын енем «баланы көп көтерме, қолға үйреніп қалады» дейді. 7 айлық баланы жылағанда көтеруім дұрыс па?"
  answer: |
    Иә, дұрыс. Нәрестені жылағанда қолға алу оны «бұзбайды». Ересек адам баланың белгілеріне болжамды әрі жылы жауап бергенде сенімді бауыр басу қалыптасады. Мұндай балалар кейін өздерін сенімдірек сезінеді және әлемді батылырақ зерттейді.

    7 айлық баланың жылауы — оның қажеттілігін білдіру тәсілі: аштық, шаршау, жайсыздық немесе жақын адамның қасында болғысы келуі.

    Сонымен қатар баланың еденде ойнауына, етпетінен жатуына, ойыншықпен өз бетінше айналысуына сіз қасында болғанда мүмкіндік беріңіз — бұл да маңызды. Ал жылағанда көтеру — қамқорлық, еркелету емес.

- id: kk-s033
  lang: kk
  profile: {age_months: 16}
  sources: [speech, screens]
  question: "Балам 1 жас 4 айлық, мультфильмнен сөз үйренсін деп күніне бір сағат қосамыз. Бұл пайдалы ма?"
  answer: |
    Өкінішке қарай, бұл жаста мультфильмнен сөз үйрену өте аз. 2 жасқа дейінгі балалар бейнеден алған білімді нақты өмірге көшіре алмайды десе болады, ал экран уақыты ойын мен тірі қарым-қатынасты ығыстырады. ДДСҰ 2 жасқа дейін экран уақытын ұсынбайды.

    Сөйлеуді шын мәнінде дамытатын нәрселер:
    - күн бойы баламен сөйлесу, не істеп жатқаныңызды айту;
    - бала қарап тұрған затты атау және оның сөзін кеңейту;
    - күн сайын кітап оқып, сұрақ қою: «Күшік қайда?»;
    - ән мен тақпақ;
    - бала жауап беруі үшін үзіліс жасау.

    Туыстармен бейнеқоңырау — тірі қарым-қатынас, ол рұқсат. Фондағы теледидарды өшіріңіз — ол баламен сөйлесу мөлшерін азайтады.

- id: kk-s034
  lang: kk
  profile: {age_months: 9}
  sources: [feeding, safety]
  question: "Балам алма жеп отырып шашалып, қатты жөтелді. Не істеуім керек еді?"
  answer: |
    Бала қатты жөтеліп, жылап немесе дыбыс шығарып отырса, бұл тыныс жолы ашық екенін және оның өзі тазартуға тырысып жатқанын білдіреді. Мұндай жағдайда:
    - баланың қасында тыныш болып, оны жөтелуге қалдырыңыз;
    - аузына саусақпен соқыр түрде кірмеңіз — затты тереңірек итеріп жіберуіңіз мүмкін;
    - арқасынан ұрмаңыз, ол жөтеліп жатқанда.

    Қауіпті белгілер — бала дыбыс шығара алмаса, жөтелі дыбыссыз болса, дем ала алмаса, көгерсе. Бұл кезде дереу жедел жәрдем шақырыңыз (103 немесе 112) және бір жасқа дейінгі балаға арналған алғашқы көмекті бастаңыз. Мұндай курсты алдын ала өткен пайдалы.

    Болашақта: шикі қатты алманы бермеңіз, оны қайнатып немесе жұмсақ етіп үгітіңіз. Бала тек отырып және бақылауда тамақтанады.

- id: kk-s035
  lang: kk
  profile: {age_months: 11}
  sources: [red_flags]
  question: "Балам іш өтіп, құсып жатыр, ерні құрғап кетті, бүгін бір-ақ рет кіші дәретке отырды. Үйде емдесем бола ма?"
  answer: |
    Ерінің құрғауы және кіші дәреттің азаюы сусызданудың белгілері болуы мүмкін, сондықтан баланы бүгін дәрігерге көрсеткен жөн.

    Сусызданудың басқа белгілері:
    - көз жассыз жылау;
    - еңбектің шұңқырлануы;
    - әлсіздік, ұйқышылдық.

    Дәрігерді күткенше:
    - емшекті немесе қоспаны жиі, аз-аздан беріңіз;
    - регидратациялық ерітіндіні бірнеше минут сайын бір шай қасықтан беріңіз;
    - шырын, газдалған сусын және дәрігер тағайындамаған дәрі бермеңіз.

    Жедел жәрдем шақырыңыз (103 немесе 112), егер бала өте әлсіз болса, оны ояту қиын болса, құсығы жасыл болса, нәжісінде қан болса немесе мүлде ішпесе.

- id: kk-s036
  lang: kk
  profile: {age_months: 33}
  sources: [toilet]
  question: "Қызым түбекке үйреніп қалған еді, бауыры туғаннан кейін қайтадан шалбарына жіберетін болды. Не істейміз?"
  answer: |
    Бұл өте жиі кездеседі және әдетте уақытша. Отбасына жаңа нәресте келгенде үлкен бала күйзеліс сезінеді, ал «кері кету» — оның назар мен қамқорлыққа деген қажеттілігін білдіру тәсілі.

    Не көмектеседі:
    - «апат» үшін ұрыспаңыз, ұялтпаңыз — тыныш ауыстырып, жалғастыра беріңіз;
    - түбекті бұрынғыдай тұрақты уақытта ұсыныңыз: ұйқыдан кейін, тамақтан кейін;
    - қызыңызбен күнде аз да болса жеке уақыт өткізіңіз;
    - оны «үлкен апа» ретінде мадақтаңыз, нәрестеге көмектесуге тартыңыз;
    - талпынысы үшін мадақтаңыз.

    Көбіне бірнеше апта ішінде бәрі қалпына келеді. Егер зәр шығару ауырса, жиі зәр шықса, көп су ішсе немесе жағдай ұзақ уақыт жақсармаса, педиатрға көрсетіңіз.
