  key_facts: [["два слова", "2 слова", "двух слов", "из двух"], ["картин", "книг"]]
  reference: "К 2 годам большинство детей соединяют два слова («мама дай»), показывают картинки в книге по названию. Если фраз из двух слов нет, стоит обратиться к педиатру или логопеду."

