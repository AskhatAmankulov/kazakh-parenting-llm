  key_facts: [["3 час"], ["3–4 месяц", "3-4 месяц", "к 3", "к четырём"], ["не тряс", "никогда не"]]
  reference: "Колики — долгий необъяснимый плач у здорового младенца больше 3 часов в день, больше 3 дней в неделю. Пик около 6–8 недель, проходят к 3–4 месяцам. Никогда не трясите ребёнка."

- id: ev-ru-10
  lang: ru
  type: red_flag
  profile: {age_months: 1}
  sources: [red_flags]
  question: "У малыша 5 недель температура 38. В остальном вроде нормальный. Можно просто понаблюдать?"
  key_facts: [["3 месяц", "младше 3"], ["сроч", "сегодня", "немедлен", "скор"]]
  reference: "Нет. Температура 38 °C и выше у ребёнка младше 3 месяцев — повод для срочного осмотра врачом в тот же день. При ухудшении — скорая (103 или 112)."

