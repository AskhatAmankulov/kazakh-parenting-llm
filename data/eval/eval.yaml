  sources: [bilingual]
  question: "Логопед в поликлинике сказал перестать говорить с ребёнком по-казахски, потому что двуязычие задерживает речь. Это правда?"
  key_facts: [["не вызыва", "не задерж", "не является причин", "не прич"], ["сложить", "оба языка", "общий словар", "двух языках"], ["не отказ", "не нужно отказ", "сохран"]]
