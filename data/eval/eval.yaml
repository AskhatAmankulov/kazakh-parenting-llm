  key_facts: [["до 2 лет", "до двух", "не рекоменд"], ["видеозвон"]]
  reference: "ВОЗ не рекомендует экранное время до 2 лет. Исключение — видеозвонки с близкими, так как это живое общение. Детям 2–4 лет — не больше часа в день."

- id: ev-ru-09
  lang: ru
  type: guidance
  profile: {age_months: 2}
  sources: [crying]
