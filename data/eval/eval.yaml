  profile: {age_months: 8}
  sources: [sleep]
  question: "Сколько должен спать ребёнок в 8 месяцев, включая дневной сон?"
  key_facts: [["12–16", "12-16", "12 до 16"], ["днём 2", "2–3 раза", "2-3 раза", "два-три", "2–3 дневн"]]
  reference: "По рекомендациям ВОЗ дети 4–11 месяцев спят 12–16 часов в сутки вместе с дневным сном. В 8 месяцев обычно 2–3 дневных сна. Если ребёнок бодр и хорошо развивается, небольшие отклонения не страшны."

- id: ev-ru-02
  lang: ru
  type: guidance
  profile: {age_months: 3}
  sources: [sleep, safety]
  question: "Можно ли класть в кроватку малыша 3 месяцев мягкие бортики и подушку, чтобы ему было удобнее?"
  key_facts: [["на спин"], ["твёрд", "тверд"], ["без подуш", "не нужн", "убрать", "не клад", "не использ"], ["свдс", "внезапн"]]
  reference: "Нет. До года спать безопаснее на спине, на твёрдом ровном матрасе без подушек, бортиков, одеял и мягких игрушек — это снижает риск синдрома внезапной детской смерти."

- id: ev-ru-03
  lang: ru
  type: guidance
  profile: {age_months: 4}
  sources: [feeding]
  question: "Ребёнку 4 месяца, на смеси. Можно уже начинать овощное пюре?"
  key_facts: [["6 месяц", "около 6", "к 6"], ["признак", "готов"], ["держит голов", "сидит"]]
  reference: "Прикорм обычно вводят около 6 месяцев и не раньше 4 месяцев. Ориентируйтесь на признаки готовности: держит голову, сидит с поддержкой, интересуется едой, не выталкивает ложку. Сроки при особых обстоятельствах обсудите с педиатром."

- id: ev-ru-04
  lang: ru
  type: guidance
  profile: {age_months: 7}
  sources: [feeding]
  question: "Какие продукты особенно важны в прикорме и что нельзя добавлять в еду малышу?"
  key_facts: [["желез"], ["соль", "соли"], ["сахар"], ["мёд", "мед"]]
  reference: "Важны продукты, богатые железом — мясо, рыба, яйца, бобовые, обогащённые каши. Не добавляйте соль и сахар, не давайте соки, а мёд нельзя до года из-за риска ботулизма."

- id: ev-ru-05
  lang: ru
  type: guidance
  profile: {age_months: 16}
  sources: [motor]
  question: "Сыну 1 год 4 месяца, он ещё не ходит сам. До какого возраста это нормально?"
  key_facts: [["18 месяц", "полутора", "1,5 год"], ["педиатр", "врач"]]
  reference: "Самостоятельная ходьба нормально начинается примерно с 8 до 18 месяцев. Если к 18 месяцам ребёнок не ходит сам, есть асимметрия движений или потеря навыков — покажите его педиатру."

- id: ev-ru-06
  lang: ru
